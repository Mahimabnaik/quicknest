<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert common length, weight and temperature units quickly."><title>Unit Converter | QuickNest</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="tool.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span>Q</span> QuickNest</a><nav><a href="index.html#tools">Tools</a><a href="about.html">About</a></nav></div></header><main class="toolwrap"><a class="crumb" href="index.html">← All tools</a><div class="toolhead"><div class="eyebrow">QUICKNEST TOOL</div><h1>Unit Converter</h1><p>Simple everyday unit conversions.</p></div><div class="panel"><div class="fields"><label>Value<input id="v" type="number" value="1"></label><label>Conversion<select id="u"><option value="kmmi">km → miles</option><option value="mikm">miles → km</option><option value="kg_lb">kg → lb</option><option value="lb_kg">lb → kg</option><option value="cm_in">cm → inches</option><option value="in_cm">inches → cm</option><option value="c_f">°C → °F</option><option value="f_c">°F → °C</option></select></label></div><button class="btn" onclick="calc()">Convert</button><div class="result"><div class="big" id="r">—</div></div></div><script>function calc(){let x=+v.value,k=u.value,r={kmmi:[x*.621371,'miles'],mikm:[x*1.609344,'km'],kg_lb:[x*2.2046226218,'lb'],lb_kg:[x*.45359237,'kg'],cm_in:[x/2.54,'inches'],in_cm:[x*2.54,'cm'],c_f:[x*9/5+32,'°F'],f_c:[(x-32)*5/9,'°C']}[k];document.getElementById('r').textContent=`${r[0].toLocaleString('en-IN',{maximumFractionDigits:6})} ${r[1]}`}</script><div class="article"><h2>Quick conversions</h2><p>These conversions use standard mathematical conversion factors. Temperature conversion uses the Celsius/Fahrenheit formulas.</p></div></main><footer><div class="wrap foot"><span>© 2026 QuickNest</span><span><a href="privacy.html">Privacy</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a></span></div></footer></body></html>
